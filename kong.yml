_format_version: "3.0"
_transform: true

services:
  - name: identity-api
    url: http://identity-api:5000
    routes:
      - name: identity-auth
        paths:
          - /api/Auth
          - /api/auth
        strip_path: false
      - name: identity-restaurantes
        paths:
          - /api/restaurantes
        strip_path: false

  - name: reservas-api
    url: http://reserva_api:8080
    routes:
      - name: reservas-route
        paths:
          - /api/reservas
          - /api/Turnos
          - /api/turnos
          - /api/odata
        strip_path: false

  - name: turnos-api
    url: http://turnos-api:8080
    routes:
      - name: turnos-route
        paths:
          - /api/v1/gestion-horarios
          - /api/v1/slots
          - /api/v1/assignments
        strip_path: false
