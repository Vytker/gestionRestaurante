global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'reservas-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['reserva_api:8080']   # el nombre de servicio en tu red Docker

  - job_name: 'identity-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['identity-api:5000']
